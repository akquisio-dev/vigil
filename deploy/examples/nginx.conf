# Dashboard behind TLS. The agent API listens on the VPN address instead
# and is not proxied here.
server {
    listen 443 ssl;
    http2 on;
    server_name soc.example.com;

    ssl_certificate     /etc/letsencrypt/live/soc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soc.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Behind a CDN, take the client address from it (example: Cloudflare):
    # set_real_ip_from <each Cloudflare range>;
    # real_ip_header CF-Connecting-IP;

    # Optional, strongly recommended: only reachable from known networks.
    # allow 10.0.0.0/24;
    # deny all;

    location /api/agent/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8470;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }
}
