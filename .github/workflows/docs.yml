name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - internal/server/rules.go
      - internal/server/rules_doc.go
      - tools/gendocs/**
      - .github/workflows/docs.yml
      - deploy/apt/**
  # The release workflow starts this on main after publishing, so the apt
  # repository gets the new packages.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Rule catalogue is up to date
        run: go run ./tools/gendocs -check
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      # GitHub Pages serves one site, replaced whole on every deploy, so the
      # apt repository is rebuilt here each time from the newest releases.
      - name: apt repository
        env:
          GH_TOKEN: ${{ github.token }}
          # API_SIGNING_KEY: the name the secret was first created under
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY || secrets.API_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::notice::APT_SIGNING_KEY is not set; the site has no apt repository"
            exit 0
          fi
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y --no-install-recommends apt-utils
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          deploy/apt/build-repo.sh site/apt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
